# old-pin: a workflow whose checkout pin is a year old (github-actions/security-hardening.md §7), for
# Dependabot to find. Pushed on lab/default with .github/dependabot.yml while lab/default is the
# default branch. workflow_dispatch only, so neither the push nor Dependabot's pull request runs it.
name: old-pin
on: workflow_dispatch
permissions: {}
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the rota
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Count the shifts
        run: |
          echo "shifts: $(($(wc -l < volunteers/rota.csv) - 1))"
